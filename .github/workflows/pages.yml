name: Deploy to GitHub Pages

# Requires Settings → Pages → Source → "GitHub Actions" (done once per fork).
#
# main and TWC both deploy to the same Pages URL (one GitHub Pages site per repo) —
# whichever branch you push to most recently is what's live. That's fine while TWC
# is this repo's actual day-to-day deployment, just don't push main and TWC back to
# back expecting both to "stick".
on:
  workflow_dispatch:
  push:
    branches: [main, TWC]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vite build --base=/${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
