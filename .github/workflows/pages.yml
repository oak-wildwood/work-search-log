name: Deploy to GitHub Pages

# Requires Settings → Pages → Source → "GitHub Actions" (done once per fork).
#
# Only the twc branch deploys to Pages. main carries the genericized/public version
# of this repo and intentionally does not publish here — pushing to main never
# touches the live site.
on:
  workflow_dispatch:
  push:
    branches: [twc]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vite build --base=/${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
