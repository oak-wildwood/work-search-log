name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Without a package manager the agent cannot run the tests, linter
          # or formatter, so it writes code it has no way to check. Every
          # defect found across the first four agent runs traced to this:
          # a failing assertion in #21, a lint failure in #22, and in #13 a
          # set of coverage thresholds guessed at thirty points below the
          # real figure because the report could not be generated.
          #
          # gh pr create is here because the action otherwise pushes a branch
          # and leaves a "Create PR" link, even when asked directly to open
          # one.
          #
          # Note the agent still cannot edit files under .github/workflows/ —
          # its token lacks workflow-write permission. Expect it to stop and
          # say so rather than work around it.
          claude_args: >-
            --allowedTools "Bash(npm:*),Bash(npx:*),Bash(gh pr create:*),Bash(gh pr view:*)"
